[pytest]
# pytest configuration for BotTrader TDD test suite

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Minimum Python version
minversion = 3.8

# Command line options
addopts = 
    -v
    --strict-markers
    --tb=short
    --maxfail=5
    --disable-warnings
    --color=yes

# Custom markers for test organization
markers =
    infrastructure: Tests for database infrastructure (TimescaleDB, Supabase)
    api: Tests for external API connections (OANDA, Alpha Vantage, TraderMade)
    ml: Tests for machine learning models
    signals: Tests for trading signal generation
    risk: Tests for risk management
    execution: Tests for order execution
    monitoring: Tests for performance monitoring
    integration: Integration tests
    e2e: End-to-end tests
    slow: Tests that take more than 5 seconds
    critical: Critical tests that must pass

# Asyncio configuration
asyncio_mode = auto

# Coverage configuration
[coverage:run]
source = src
omit = 
    */tests/*
    */test_*.py
    */__init__.py
    */migrations/*
    */config/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (in seconds)
timeout = 300

# Parallel execution (if using pytest-xdist)
# addopts = -n auto