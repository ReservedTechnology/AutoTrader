[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m src.core.main"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[env]
PYTHON_VERSION = "3.11"
NODE_ENV = "production"
TZ = "UTC"

# Variables de entorno para conexiones externas se configuran en Railway dashboard:
# DATABASE_URL - Referencia automática a PostgreSQL service
# SUPABASE_URL - URL de tu proyecto Supabase
# SUPABASE_ANON_KEY - Clave pública de Supabase
# SUPABASE_SERVICE_KEY - Clave de servicio de Supabase
# OANDA_API_KEY - API key de OANDA
# OANDA_ACCOUNT_ID - ID de cuenta OANDA
# OANDA_ENVIRONMENT - practice/live
# ALPHA_VANTAGE_API_KEY - API key de Alpha Vantage
# TRADERMADE_API_KEY - API key de TraderMade